<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>登录宝可梦训练家俱乐部</title><link rel="stylesheet" href="pgl.css"></head>
<body><div class="pgl-login-widget">
<p class="pgl-heading">使用本服的训练家俱乐部账号登录</p>
<form class="pgl-form" id="pgl-login-form" method="post">
  <div class="pgl-field"><input class="pgl-input" aria-label="用户名" type="text" name="username" placeholder="用户名" autocomplete="username"></div>
  <div class="pgl-field"><input class="pgl-input" aria-label="密码" type="password" name="password" placeholder="密码" autocomplete="current-password"></div>
  <p class="pgl-error" id="pgl-login-error" role="alert" hidden></p>
  <input class="pgl-login-button" type="submit" name="Login" value="登录">
</form>
<p class="pgl-heading">还没有账号？</p>
<div class="pgl-signup-wrap"><a class="pgl-signup-button" href="/www.pokemon.com/zh/account/pgl/signup/" target="_top">注册账号</a></div>
</div><script src="pgl.js"></script></body></html>
